<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nailed It Roofing Solutions · Project Hub</title>
<style>
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);padding:16px}
#login .lcard{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px}
#login h1{font-size:20px}
#login label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
#login input{width:100%}
#login .err{margin:0;font-size:13px}
#login p.hint{margin:0}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar of views on the left, one working area on the right.
   Home is a dashboard of linked views; the other views are Notion-style board and table views of one Projects database. */
:root{
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --bg:#FAFAFA; --surface:#FFFFFF; --sunken:#F4F4F5; --line:#E4E4E7; --line-strong:#D4D4D8;
  --fg:#09090B; --muted:#52525B; --faint:#71717A;
  --accent:#111111; --accent-fg:#FFFFFF; --accent-soft:#F4F4F5;
  --danger:#B42318; --danger-soft:#FEF3F2;
  --scrim:rgba(12,18,27,.45);
  --p1-bg:#F4F4F5; --p1-fg:#27272A;
  --p2-bg:#F4F4F5; --p2-fg:#27272A;
  --p3-bg:#F4F4F5; --p3-fg:#27272A;
  --p4-bg:#F4F4F5; --p4-fg:#27272A;
  --p5-bg:#F4F4F5; --p5-fg:#27272A;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A; --surface:#111111; --sunken:#1A1A1A; --line:#262626; --line-strong:#3A3A3A;
    --fg:#FAFAFA; --muted:#A1A1AA; --faint:#8A8A93;
    --accent:#FAFAFA; --accent-fg:#0A0A0A; --accent-soft:#1F1F1F;
    --danger:#F87171; --danger-soft:#2A1515;
    --scrim:rgba(0,0,0,.6);
    --p1-bg:#262626; --p1-fg:#E5E5E5;
    --p2-bg:#262626; --p2-fg:#E5E5E5;
    --p3-bg:#262626; --p3-fg:#E5E5E5;
    --p4-bg:#262626; --p4-fg:#E5E5E5;
    --p5-bg:#262626; --p5-fg:#E5E5E5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#111111; --sunken:#1A1A1A; --line:#262626; --line-strong:#3A3A3A;
  --fg:#FAFAFA; --muted:#A1A1AA; --faint:#8A8A93;
  --accent:#FAFAFA; --accent-fg:#0A0A0A; --accent-soft:#1F1F1F;
  --danger:#F87171; --danger-soft:#2A1515;
  --scrim:rgba(0,0,0,.6);
  --p1-bg:#262626; --p1-fg:#E5E5E5;
  --p2-bg:#262626; --p2-fg:#E5E5E5;
  --p3-bg:#262626; --p3-fg:#E5E5E5;
  --p4-bg:#262626; --p4-fg:#E5E5E5;
  --p5-bg:#262626; --p5-fg:#E5E5E5;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans)}
button,select,input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:32px;max-width:1400px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main{min-width:0}

/* sidebar */
.side{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:18px;min-width:0}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-size:15px;font-weight:700}
.brand span{font:11.5px var(--mono);color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:12px 8px 4px;font-weight:600}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border:0;border-radius:6px;background:none;color:var(--muted);font-weight:500;text-align:left;cursor:pointer;white-space:nowrap}
.navbtn:hover{background:var(--sunken);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--sunken);color:var(--fg);font-weight:600}
.sidefoot{padding:0 8px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sidefoot p{margin:0;font-size:12px;color:var(--faint)}

/* page header and filters */
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.top>div:first-child{min-width:0;flex:1 1 320px}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.cap{font:12px/1.5 var(--mono);color:var(--faint);margin:6px 0 0}
.filters{display:flex;flex-wrap:wrap;gap:10px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
select,input[type=text],input[type=number],input[type=date],textarea{color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;min-height:34px;min-width:0}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer;min-height:34px}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(.94)}

/* shared bits */
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:12px}
.nowrap{white-space:nowrap}
.ic{width:16px;height:16px;flex:none}
.linkbtn{border:0;background:none;padding:0;font-weight:600;color:var(--accent);cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
.pill{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap}
.ph1{background:var(--p1-bg);color:var(--p1-fg)}
.ph2{background:var(--p2-bg);color:var(--p2-fg)}
.ph3{background:var(--p3-bg);color:var(--p3-fg)}
.ph4{background:var(--p4-bg);color:var(--p4-fg)}
.ph5{background:var(--p5-bg);color:var(--p5-fg)}
.chip{display:inline-block;padding:1px 7px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.chip.warn{background:var(--danger-soft);color:var(--danger)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--line-strong);border-radius:4px;padding:0 6px 0 4px;white-space:nowrap}
.tag .ic{width:12px;height:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grow{flex:1 1 220px;min-width:0}

/* blocks (linked views) */
.block{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.bh{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.bh h2{display:flex;align-items:center;gap:8px;margin:0;font-size:15px;font-weight:600}
.bh .cap{margin:4px 0 0;font-size:11.5px}
.count{font:500 12px var(--mono);background:var(--sunken);color:var(--muted);padding:1px 7px;border-radius:10px}
.pad{padding:14px 16px}
.emptynote{margin:0;padding:18px 16px;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:flex-start;padding:11px 16px;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.foot{display:flex;flex-wrap:wrap;gap:6px 24px;margin:0;padding:10px 16px;border-top:1px solid var(--line);background:var(--bg);border-radius:0 0 8px 8px;color:var(--muted);font-size:12.5px}
.foot b{color:var(--fg)}

.home{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:16px}
.stagechip{display:flex;flex-direction:column;align-items:flex-start;padding:8px 10px;border:0;border-radius:6px;cursor:pointer;text-align:left}
.stagechip:hover{filter:brightness(.96)}
.stagechip .n{font:500 20px/1.15 var(--mono)}
.stagechip .l{font-size:12px;font-weight:600}

/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:268px;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:start}
.col{background:var(--sunken);border-radius:8px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.col-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 4px}
.col-v{font:11.5px var(--mono);color:var(--faint);white-space:nowrap}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:5px;cursor:grab}
.card:hover{border-color:var(--line-strong)}
.card.dragging{opacity:.45}
.card-top{display:flex;align-items:center;gap:8px;padding-right:30px}
.job{font-size:12px;color:var(--faint)}
.card-title{font-weight:600;line-height:1.3}
.card-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12.5px}
.card-next{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-open{position:absolute;top:6px;right:6px;width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:5px;background:none;color:var(--faint);cursor:pointer}
.card-open:hover{background:var(--sunken);color:var(--fg)}
.empty{border:1px dashed var(--line-strong);border-radius:6px;padding:16px 10px;text-align:center;color:var(--faint);font-size:12.5px}

/* updates */
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:11px 16px;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed.flush li{padding-left:0;padding-right:0}
.u-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.u-n{margin:4px 0 0}
.mention{color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:0 3px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line)}
.segbtn{border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);border-radius:14px;padding:3px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.segbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.composer{display:flex;flex-direction:column;gap:10px}
.composer label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.crow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.crow>label{flex:1 1 140px}
textarea{resize:vertical;width:100%}
.hint{margin:0;font-size:12px;color:var(--faint)}
.err{color:var(--danger);font-weight:600}

/* project panel */
#overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--scrim);padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#panel{width:min(1120px,100%);max-height:100%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 26px 28px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ph h2{margin:2px 0 0;font-size:21px;line-height:1.2;text-wrap:balance}
.ph p{margin:0;font-size:12px}
.iconbtn{width:36px;height:36px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:6px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--sunken)}
.psec h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:24px 0 8px;font-weight:600}
.prop{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:center;padding:4px 0}
.prop .k{color:var(--muted)}
.prop input[type=text],.prop input[type=number],.prop input[type=date],.prop select{width:100%}
.prop input[type=number]{text-align:right;font-family:var(--mono)}
.prop input[type=checkbox]{width:18px;height:18px;justify-self:start}
.collected{margin:6px 0 0;color:var(--muted);font-size:12.5px}
.collected b{color:var(--fg)}
.linkrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;min-width:0}
.linkrow .ic{color:var(--muted)}
.linkrow span:last-child{min-width:0;overflow-wrap:anywhere}
.check{list-style:none;margin:0;padding:0}
.check li{padding:3px 0}
.check label{display:flex;align-items:center;gap:10px;cursor:pointer}
.check input{width:18px;height:18px;flex:none}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:6px;font-weight:500;z-index:80;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:1}

@media (max-width:1180px){.home{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px}
  .side{position:static;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav h2{display:none}
  .navbtn{width:auto}
  .sidefoot{flex-direction:row;align-items:center;flex-wrap:wrap}
  h1{font-size:22px}
}
@media (max-width:520px){
  .prop{grid-template-columns:minmax(0,1fr);gap:3px}
  #panel{padding:18px 16px 24px}
}
@media (pointer:coarse){
  select,input[type=text],input[type=number],input[type=date],textarea,.btn,.navbtn,.iconbtn{min-height:44px}
  .iconbtn{width:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* additions for the saved, shared version */
.sync{display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:#2E8B57}
.dot.bad{background:var(--danger)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.hero{border:1px dashed var(--line-strong);border-radius:8px;padding:40px 20px;text-align:center;background:var(--surface)}
.hero h2{margin:0 0 6px;font-size:18px}
.hero p{margin:0 auto 16px;max-width:46ch;color:var(--muted)}
a.linkrow{color:inherit;text-decoration:none}
a.linkrow:hover{background:var(--sunken)}
.linkrow .sub{display:block}
.notice{margin:0 0 16px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--muted)}
.delrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* stage colors, chat, stage editor */
:root{
 --sc-gray-bg:#F4F4F5;--sc-gray-fg:#27272A;
 --sc-blue-bg:#EEF4FF;--sc-blue-fg:#1D4ED8;
 --sc-teal-bg:#E6F6F4;--sc-teal-fg:#0F766E;
 --sc-green-bg:#E7F6EC;--sc-green-fg:#15803D;
 --sc-yellow-bg:#FEF6DC;--sc-yellow-fg:#A16207;
 --sc-orange-bg:#FFEFE0;--sc-orange-fg:#C2410C;
 --sc-red-bg:#FEF3F2;--sc-red-fg:#B42318;
 --sc-pink-bg:#FDEBF3;--sc-pink-fg:#BE185D;
 --sc-purple-bg:#F3EEFF;--sc-purple-fg:#6D28D9;
 --sc-brown-bg:#F3EBE4;--sc-brown-fg:#78350F;
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
 --sc-gray-bg:#262626;--sc-gray-fg:#E5E5E5;
 --sc-blue-bg:#14233F;--sc-blue-fg:#93B4FF;
 --sc-teal-bg:#0F2B29;--sc-teal-fg:#5EEAD4;
 --sc-green-bg:#12281B;--sc-green-fg:#86EFAC;
 --sc-yellow-bg:#2E2508;--sc-yellow-fg:#FCD34D;
 --sc-orange-bg:#33200F;--sc-orange-fg:#FDBA74;
 --sc-red-bg:#2A1515;--sc-red-fg:#F87171;
 --sc-pink-bg:#331626;--sc-pink-fg:#F9A8D4;
 --sc-purple-bg:#25193F;--sc-purple-fg:#C4B5FD;
 --sc-brown-bg:#2A1F17;--sc-brown-fg:#D6B39A;
 }
}
:root[data-theme="dark"]{
 --sc-gray-bg:#262626;--sc-gray-fg:#E5E5E5;
 --sc-blue-bg:#14233F;--sc-blue-fg:#93B4FF;
 --sc-teal-bg:#0F2B29;--sc-teal-fg:#5EEAD4;
 --sc-green-bg:#12281B;--sc-green-fg:#86EFAC;
 --sc-yellow-bg:#2E2508;--sc-yellow-fg:#FCD34D;
 --sc-orange-bg:#33200F;--sc-orange-fg:#FDBA74;
 --sc-red-bg:#2A1515;--sc-red-fg:#F87171;
 --sc-pink-bg:#331626;--sc-pink-fg:#F9A8D4;
 --sc-purple-bg:#25193F;--sc-purple-fg:#C4B5FD;
 --sc-brown-bg:#2A1F17;--sc-brown-fg:#D6B39A;
}
.sc-gray{background:var(--sc-gray-bg);color:var(--sc-gray-fg)}
.sc-blue{background:var(--sc-blue-bg);color:var(--sc-blue-fg)}
.sc-teal{background:var(--sc-teal-bg);color:var(--sc-teal-fg)}
.sc-green{background:var(--sc-green-bg);color:var(--sc-green-fg)}
.sc-yellow{background:var(--sc-yellow-bg);color:var(--sc-yellow-fg)}
.sc-orange{background:var(--sc-orange-bg);color:var(--sc-orange-fg)}
.sc-red{background:var(--sc-red-bg);color:var(--sc-red-fg)}
.sc-pink{background:var(--sc-pink-bg);color:var(--sc-pink-fg)}
.sc-purple{background:var(--sc-purple-bg);color:var(--sc-purple-fg)}
.sc-brown{background:var(--sc-brown-bg);color:var(--sc-brown-fg)}

.boardbar{display:flex;justify-content:flex-end;margin-bottom:10px}

/* chat */
.chat{display:grid;grid-template-columns:270px minmax(0,1fr);border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.convos{border-right:1px solid var(--line);max-height:min(76vh,720px);overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.convo{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:var(--fg);width:100%;min-width:0}
.convo:hover{background:var(--bg)}
.convo[aria-current="true"]{background:var(--accent-soft)}
.convo b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane{display:flex;flex-direction:column;min-width:0}
.panehead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.panehead h2{margin:0;font-size:15px;font-weight:600}
.thread{height:min(56vh,520px);overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;background:var(--bg)}
.thread.small{height:auto;max-height:320px;border:1px solid var(--line);border-radius:8px}
.day{align-self:center;font-size:11.5px;font-weight:600;color:var(--faint);background:var(--sunken);border-radius:10px;padding:1px 10px;margin:12px 0 4px}
.msg{display:flex;gap:10px;max-width:min(640px,94%);margin-top:12px;align-self:flex-start}
.msg.cont{margin-top:3px}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.msg.cont .av{visibility:hidden}
.mb{min-width:0;display:flex;flex-direction:column;gap:3px}
.msg.mine .mb{align-items:flex-end}
.mh{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.mh b{color:var(--fg)}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine .bubble{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);border-radius:14px 4px 14px 14px}
.msg.mine .mention{background:transparent;color:inherit;text-decoration:underline}
.msg.issue:not(.mine) .bubble{border-color:var(--danger)}
.chatbar{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.chatbar .row{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:flex-end}
.chatbar .row>label{flex:0 1 150px}
.chatbar textarea{flex:1 1 220px;min-height:44px;resize:none;width:auto}
.inpanel .chatbar{padding:12px 0 0;border-top:0}

/* stage editor */
.strow{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.srow1{display:flex;gap:8px;align-items:center}
.srow1 input[type=text]{flex:1 1 auto;min-width:0}
.srow2{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line-strong)}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.inl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.inl input{width:16px;height:16px}
.iconbtn.sm{width:32px;height:32px}

@media (max-width:860px){
  .chat{grid-template-columns:minmax(0,1fr)}
  .convos{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);max-height:none;overflow-x:auto}
  .convo{width:190px;flex:none;border-bottom:0;border-right:1px solid var(--line)}
}

/* branding, profile chip, inbox, settings */
.brand{gap:4px}
.brand b{line-height:1.25}
.brand .bsub{font:500 11.5px var(--mono);color:var(--faint);letter-spacing:.04em}
.logobox{width:100%;max-width:170px;margin-bottom:6px}
.logobox:empty{display:none}
.logobox img{max-width:100%;max-height:72px;object-fit:contain;display:block}
.logoimg{border:0;background:none;padding:0;cursor:pointer;display:block;border-radius:6px}
.logoadd{border:1px dashed var(--line-strong);border-radius:8px;background:none;color:var(--muted);font-weight:600;padding:14px 12px;cursor:pointer;width:100%;font-size:12.5px}
.logoadd:hover{background:var(--sunken)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logobox img,:root:not([data-theme="light"]) .logoprev{background:#fff;padding:6px;border-radius:8px}}
:root[data-theme="dark"] .logobox img,:root[data-theme="dark"] .logoprev{background:#fff;padding:6px;border-radius:8px}
.mechip{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;color:var(--fg);min-width:0}
.mechip:hover{background:var(--sunken)}
.mechip .av{width:28px;height:28px;font-size:12px}
.mechip .mt{display:flex;flex-direction:column;min-width:0}
.mechip .mt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mechip .mt span{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbadge{margin-left:auto;background:var(--accent);color:var(--accent-fg);border-radius:10px;font-size:11px;font-weight:700;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
.inbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.inbox{list-style:none;margin:0;padding:0}
.inbox li{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-start;position:relative}
.inbox li:first-child{border-top:0}
.inbox li.unread{background:var(--accent-soft)}
.inbox li.unread::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.inbox .ib{min-width:0;flex:1}
.mentions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mchip{border:1px solid var(--line-strong);background:var(--surface);color:var(--accent);border-radius:12px;padding:2px 9px;font-size:12px;font-weight:600;cursor:pointer}
.mchip:hover{background:var(--accent-soft)}
.postas{font-size:12.5px;color:var(--muted);align-self:center}
.mrow{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}
.mrow .g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mrow label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.mrow label.inl{flex-direction:row;font-weight:400}
.mrow .srow1 .av{width:30px;height:30px}
.tog{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:13.5px;cursor:pointer}
.tog input{width:18px;height:18px;margin-top:2px;flex:none}
.logoprev{max-width:180px;max-height:90px;object-fit:contain;display:block;margin-bottom:8px}
.psec textarea.list{width:100%;min-height:84px}
.psec .composer>label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
#login .sub{margin:-8px 0 0;font:500 12px var(--mono);color:var(--faint);letter-spacing:.04em}
@media (max-width:860px){.mechip{width:auto}.logobox{max-width:120px}}

input[type=password],input[type=email],input[type=tel],input[type=search]{color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;min-height:34px;min-width:0;font:inherit}
#login input{width:100%;box-sizing:border-box;font:inherit}
@media (pointer:coarse){input[type=password]{min-height:44px}}
.chatbar{position:relative}
.mpop{position:absolute;left:16px;bottom:calc(100% - 4px);z-index:20;min-width:230px;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:4px;display:flex;flex-direction:column}
.inpanel .mpop{left:0}
.mopt{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--fg);padding:6px 8px;border-radius:6px;cursor:pointer;text-align:left;width:100%}
.mopt:hover,.mopt[aria-selected="true"]{background:var(--accent-soft)}
.mopt .av{width:24px;height:24px;font-size:11px}
.mopt small{color:var(--faint);margin-left:auto;padding-left:10px}
.acct{display:flex;flex-direction:column;gap:6px}
.lkrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;gap:8px;align-items:end}
.lkrow label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:520px){.lkrow{grid-template-columns:minmax(0,1fr) auto}.lkrow label:nth-child(2){grid-column:1/-1;order:3}}

/* two-column project window */
.pcols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0 32px;align-items:start}
.pcol{min-width:0}
.pcol>.psec:first-child h3{margin-top:22px}
.check li.x{display:flex;align-items:center;justify-content:space-between;gap:8px}
.check li.x label{flex:1;min-width:0;overflow-wrap:anywhere}
.check li.x .rm{border:0;background:none;color:var(--faint);cursor:pointer;padding:2px 8px;border-radius:4px;flex:none}
.check li.x .rm:hover{background:var(--sunken);color:var(--danger)}
.chkadd{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.chkadd>input{min-width:0}
.ci{padding:7px 0}
.ci-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ci-top label{flex:1;min-width:0;overflow-wrap:anywhere}
.ci .rm{border:0;background:none;color:var(--faint);cursor:pointer;padding:2px 8px;border-radius:4px;flex:none;opacity:.35}
.ci:hover .rm,.ci .rm:focus-visible{opacity:1}
.ci .rm:hover{background:var(--sunken);color:var(--danger)}
.ci-meta{display:flex;flex-wrap:wrap;gap:2px 14px;align-items:center;margin:1px 0 0 28px;font-size:12.5px;color:var(--faint)}
.chkadd .ci-meta{margin:2px 0 0 0}
.wpick{position:relative;display:inline-block;cursor:pointer;border-radius:3px}
.wpick.set{color:var(--fg)}
.wpick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;min-height:0;padding:0;border:0}
.dpick{position:relative;display:inline-block;cursor:pointer;border-radius:3px}
.dpick.set{color:var(--fg)}
.dpick.od{color:var(--danger);font-weight:600}
.dpick input{position:absolute;right:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;min-height:0;padding:0;border:0}
.dpick:focus-within input{opacity:1;z-index:5;width:138px;height:30px;top:-6px;padding:0 6px;font-size:12.5px;color:var(--fg);background:var(--surface);border:1px solid var(--accent);border-radius:6px}
.wpick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.ci-ok{color:var(--p5-fg);font-weight:600}
.chkadd .btn{min-height:28px;padding:2px 12px}
.addbtns{margin-left:auto;display:flex;gap:6px}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 0 8px;font-size:12.5px;color:var(--muted)}
.selbar .grow{flex:1}
.chip.ok{background:var(--p5-bg);color:var(--p5-fg)}
.ci-done{color:var(--muted)}
/* one-line checklist rows; unset controls appear on hover or focus */
.check li.ci{display:flex;align-items:center;gap:10px;padding:6px 0}
.ci-t{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere;cursor:pointer}
.check li.ci .ci-meta{margin:0;flex:none;gap:6px;flex-wrap:nowrap}
.check li.ci .wpick:not(.set),.check li.ci .dpick:not(.set){opacity:0;transition:opacity .12s}
.check li.ci:hover .wpick,.check li.ci:hover .dpick,.check li.ci:focus-within .wpick,.check li.ci:focus-within .dpick{opacity:1}
@media (pointer:coarse){.check li.ci .wpick:not(.set),.check li.ci .dpick:not(.set){opacity:.7}}
@media (max-width:520px){.check li.ci{flex-wrap:wrap}.check li.ci .ci-meta{order:3;flex-basis:100%;margin-left:28px}}
.hist{list-style:none;margin:0;padding:0;max-height:270px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.hist li{padding:8px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:1px;font-size:13px}
.hist li:first-child{border-top:0}
.hist small{color:var(--faint);font-size:12px}
.feedbar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
@media (max-width:860px){.pcols{grid-template-columns:minmax(0,1fr)}}
/* checklist groups, next steps, attention tasks */
.check li.cg{display:flex;align-items:center;gap:8px;padding:14px 0 2px}
.check li.cg:first-child{padding-top:0}
.cgn{font-size:12px;color:var(--faint)}
.cgcur{font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.nxl{margin-bottom:2px}
.nxdone{margin:0 0 8px;font-weight:600}
.rows li.at{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.at-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.at-t{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rows .at-t li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 12px;padding:3px 0;border-top:0}
.at-m{font-size:12.5px;color:var(--muted)}
.at-m .od,.od{color:var(--danger)}
.at-ready{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px}
/* ---- v4: full-width shell, drawer menu, modern font, chat, list, story ---- */
:root{--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{font-size:14px;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
.mono,.count,.col-v,.stagechip .n,.job,.prop input[type=number],.cap,.bsub{font-variant-numeric:tabular-nums}
.cap{font-size:13px}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);gap:0;max-width:none;margin:0;padding:0;min-height:100vh}
.app.collapsed{grid-template-columns:minmax(0,1fr)}
.app.collapsed .side{display:none}
.side{position:sticky;top:0;height:100vh;align-self:start;background:var(--surface);border-right:1px solid var(--line);padding:12px 10px 10px;gap:10px;overflow-y:auto;z-index:40}
.main{padding:18px clamp(14px,2.2vw,34px) 56px;min-width:0}
.brand{flex-direction:row;align-items:center;gap:9px;padding:2px 4px 6px}
.logobox{width:auto;max-width:none;margin:0;flex:none}
.logobox img{height:28px;width:auto;max-width:92px;border-radius:5px}
.logoadd{width:28px;height:28px;padding:0;border-radius:6px;font-size:16px;line-height:1}
.bt{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:12.5px;line-height:1.2}
.brand .bsub{font:500 10.5px var(--sans);letter-spacing:.02em}
.newbtn{width:100%;justify-content:center}
.nav h2{display:flex;align-items:center;justify-content:space-between}
.navbtn{padding:6px 8px;font-size:13.5px}
.nvedit{border:0;background:none;color:var(--faint);cursor:pointer;padding:0 4px;font-size:13px;border-radius:4px}
.nvedit:hover{color:var(--fg);background:var(--sunken)}
.navrow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;border:1px dashed var(--line-strong);margin:2px 0;cursor:grab;color:var(--muted);font-size:13px}
.navrow.hiddenv{opacity:.5}
.navrow.dragover{outline:2px dashed var(--accent)}
.navrow .nl{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.navrow .nvctl{display:flex;gap:2px}
.nvb{border:0;background:var(--sunken);color:var(--fg);border-radius:4px;padding:2px 6px;cursor:pointer;font-size:11.5px}
.nvb:disabled{opacity:.35;cursor:default}
.sidefoot{margin-top:auto;position:relative;padding:8px 0 0;border-top:1px solid var(--line);align-items:stretch;gap:0}
.mechip{border:0;background:none;padding:5px 6px;width:100%}
.mechip .dots{margin-left:auto;color:var(--faint);font-weight:700}
.umenu{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:4px;display:flex;flex-direction:column;z-index:60}
.umi{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--fg);font-weight:500}
.umi:hover{background:var(--sunken)}
.th{display:flex;align-items:flex-start;gap:12px;min-width:0}
.menubtn{width:34px;height:34px;margin-top:-2px}
h1{font-size:22px}
.navscrim{display:none}
.btn.sm{min-height:30px;padding:3px 10px;font-size:12.5px}

/* chat, Teams style */
.chat{grid-template-columns:320px minmax(0,1fr);height:calc(100vh - 128px);min-height:460px}
.convos{max-height:none;height:100%}
.convohead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.convo{flex-direction:row;align-items:flex-start;gap:10px;position:relative}
.convo .ct{display:flex;flex-direction:column;min-width:0;flex:1;gap:1px;font-size:13px;color:var(--fg);white-space:normal;overflow:visible}
.convo .row1{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--fg);white-space:nowrap;overflow:visible}
.convo .row1 b{overflow:hidden;text-overflow:ellipsis}
.convo .row1 small{color:var(--faint);font-size:11.5px;flex:none}
.convo .snip{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo .ptag{font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo .av{width:34px;height:34px}
.cdot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px}
.pane{min-height:0;height:100%}
.thread{height:auto;flex:1;min-height:0}
.thread.small{flex:none;max-height:320px}
.panehead{gap:8px 14px}
.phd{min-width:0;flex:1}
.phd h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backbtn{display:none}
.panehead select{min-height:30px;padding:2px 6px;font-size:12.5px}
.psec form.composer{position:relative}

/* list view (grouped by stage) */
.grp{margin-bottom:16px}
.grp-h{display:flex;align-items:center;gap:8px;padding:6px 4px;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--fg)}
.grp-h .caret{display:inline-block;transition:transform .15s;color:var(--faint);width:14px}
.grp-h[aria-expanded="false"] .caret{transform:rotate(-90deg)}
.grp-h .gv{margin-left:auto;color:var(--faint);font-size:12.5px}
.ltable{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.prow{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1.8fr) 96px;gap:14px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.prow:first-child{border-top:0}
.prow:hover{background:var(--bg)}
.prow.head{cursor:default;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding-block:7px;background:var(--bg)}
.prow.head:hover{background:var(--bg)}
.prow .r{text-align:right}
.prow .nm{display:flex;flex-direction:column;min-width:0}
.prow .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small{color:var(--faint);font-size:12px}
.prow .nx{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;font-size:12.5px}
.grp~.grp .prow.head{display:none}
.lav{display:inline-flex;align-items:center;gap:6px;min-width:0}
.lav .av{width:22px;height:22px;font-size:11px}
.lav .lname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
@media (max-width:860px){
  .prow{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .prow.head{display:none}
  .prow>:nth-child(2){order:3}
  .prow>:nth-child(3){grid-column:1/-1;order:4}
  .prow>:nth-child(4){grid-column:1/-1;order:5}
  .prow .r{order:2}
}

/* story */
.track{display:flex;gap:3px;min-width:60px}
.track i{flex:1;height:5px;border-radius:3px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.track i.done{background:var(--accent);opacity:.55;box-shadow:none}
.track i.cur{background:var(--accent);box-shadow:none}
.tracklg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(64px,1fr);gap:4px;overflow-x:auto;padding-bottom:2px}
.tseg{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--faint);text-align:center}
.tseg i{height:7px;border-radius:4px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-strong)}
.tseg.done i{background:var(--accent);opacity:.55;box-shadow:none}
.tseg.cur i{background:var(--accent);box-shadow:none}
.tseg.cur{color:var(--fg);font-weight:700}
.story{background:var(--accent-soft);border-radius:10px;padding:14px 16px;margin:16px 0 0;display:flex;flex-direction:column;gap:12px}
.story .lead{margin:0;font-size:15px;font-weight:600;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted)}
.stories{list-style:none;margin:0;padding:0}
.stories li{padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:7px}
.stories li:first-child{border-top:0}
.stories li:hover{background:var(--bg)}
.stories .sh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.stories .sh .lav{margin-left:auto}
.stories p{margin:0}
.tl{list-style:none;margin:0 0 0 6px;padding:0 0 0 16px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 4px}
.tl li::before{content:"";position:absolute;left:-23px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl li.future{color:var(--faint)}
.tl li.future::before{border-color:var(--line-strong)}
.tl .when{font-size:12px;color:var(--faint);display:block}
.chatlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

/* links */
.linkitem{display:flex;gap:6px;align-items:stretch;margin-bottom:6px}
.linkitem .linkrow{flex:1;margin:0}
.linkform{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px}

/* board cards */
.card .track{margin-top:2px}
.card-meta{align-items:center}

@media (max-width:860px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .side,.app.collapsed .side{display:flex;position:fixed;left:0;top:0;bottom:0;width:min(280px,86vw);height:100dvh;transform:translateX(-102%);transition:transform .2s;z-index:70;padding-top:max(12px,env(safe-area-inset-top,0px))}
  .app.navopen .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .app.navopen .navscrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:65}
  .nav{flex-direction:column;overflow:visible;gap:2px}
  .nav h2{display:flex}
  .navbtn{width:100%}
  .sidefoot{flex-direction:column;flex-wrap:nowrap;align-items:stretch}
  .main{padding:12px 14px 40px}
  .cap{display:none}
  .chat{grid-template-columns:minmax(0,1fr);height:calc(100dvh - 118px)}
  .convos{flex-direction:column;border-right:0;border-bottom:0;max-height:none;overflow-y:auto}
  .convo{width:100%;flex:none;border-right:0;border-bottom:1px solid var(--line)}
  .chat.inpane .convos{display:none}
  .chat:not(.inpane) .pane{display:none}
  .backbtn{display:grid}
  .board{grid-auto-columns:82vw;scroll-snap-type:x proximity}
  .col{scroll-snap-align:start}
}
@media (max-width:520px){
  .filters{width:100%}
  .filters label{flex:1}
  .filters select{width:100%}
  #overlay{padding:0}
  #panel{width:100%;height:100%;max-height:none;border-radius:0;border:0}
  .chatbar .row>label{flex:1 1 120px}
}

<script>
(function(){
'use strict';
var cfg=window.HUB_CONFIG||{};
var gate=document.getElementById('login');
var err=document.getElementById('lg-err');
function noop(){window.claude={use:function(){return Promise.resolve(null)}}}
if(!window.supabase||!cfg.url||!cfg.key||/^YOUR_/.test(cfg.url)||/^YOUR_/.test(cfg.key)){
  noop();
  gate.hidden=false;
  document.getElementById('loginform').innerHTML='<h1>Nailed It Roofing Solutions</h1><p class="hint">Setup is not finished. Open config.js and paste in your Supabase project URL and anon key.</p>';
  return;
}
var sb=window.supabase.createClient(cfg.url,cfg.key);
var resolveAuth;var authed=new Promise(function(r){resolveAuth=r});
window.HUB_USER={email:''};
window.HUB_AUTH={changePassword:async function(pw){var r=await sb.auth.updateUser({password:pw});if(r.error)throw r.error},
  createUser:async function(email,password){
    var r=await sb.functions.invoke('manage-user',{body:{email:email,password:password}});
    if(r.error){
      var msg='Could not reach the sign-in service. Has the manage-user function been added in Supabase yet?';
      try{var j=await r.error.context.json();if(j&&j.error)msg=j.error}catch(e){}
      throw new Error(msg);
    }
    return r.data||{};
  }};
async function ok(){
  try{var s=await sb.auth.getSession();window.HUB_USER.email=((s.data&&s.data.session&&s.data.session.user&&s.data.session.user.email)||'').toLowerCase()}catch(e){}
  gate.hidden=true;resolveAuth();
}

/* The page was written against a small document store (collections of documents).
   This adapter provides the same calls on top of three Supabase tables. */
function makeDb(){
  function watch(table,load){
    var last=null,dead=false;
    function run(){
      if(dead)return;
      load(function(sig){if(sig===last)return false;last=sig;return true});
    }
    run();
    var ch=sb.channel('hub-'+table+'-'+Math.random().toString(36).slice(2))
      .on('postgres_changes',{event:'*',schema:'public',table:table},run).subscribe();
    var iv=setInterval(run,30000);
    return function(){dead=true;clearInterval(iv);sb.removeChannel(ch)};
  }
  function fail(error){var e=new Error(error.message);e.code='unavailable';throw e}
  var api={
    collection:function(c){return {
      doc:function(id){
        var did=id||(window.crypto&&crypto.randomUUID?crypto.randomUUID():('d'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)));
        return {id:did,
          set:async function(d){var r=await sb.from(c).upsert({id:did,data:d,updated_at:new Date().toISOString()});if(r.error)fail(r.error)},
          delete:async function(){var r=await sb.from(c).delete().eq('id',did);if(r.error)fail(r.error)}};
      },
      onSnapshot:function(cb,onErr){
        return watch(c,async function(changed){
          var r=await sb.from(c).select('id,data');
          if(r.error){if(onErr)onErr({code:'unavailable',message:r.error.message});return}
          var rows=r.data||[];
          if(!changed(JSON.stringify(rows)))return;
          cb({docs:rows.map(function(x){return {id:x.id,data:function(){return x.data}}})});
        });
      }};
    },
    doc:function(path){
      var parts=path.split('/');
      if(parts[0]!=='settings')return api.collection(parts[0]).doc(parts[1]);
      var key=parts[1];
      return {
        set:async function(d){var r=await sb.from('settings').upsert({key:key,data:d,updated_at:new Date().toISOString()});if(r.error)fail(r.error)},
        get:async function(){var r=await sb.from('settings').select('data').eq('key',key).maybeSingle();if(r.error)fail(r.error);var d=r.data?r.data.data:undefined;return {exists:d!==undefined,data:function(){return d}}},
        onSnapshot:function(cb,onErr){
          return watch('settings',async function(changed){
            var r=await sb.from('settings').select('data').eq('key',key).maybeSingle();
            if(r.error){if(onErr)onErr({code:'unavailable',message:r.error.message});return}
            var d=r.data?r.data.data:undefined;
            if(!changed(JSON.stringify(d===undefined?null:d)))return;
            cb({exists:d!==undefined,data:function(){return d}});
          });
        }
      };
    }
  };
  return api;
}
var db=makeDb();
window.claude={use:async function(n){
  if(n==='db'){await authed;return db}
  if(n==='user')return {can:function(){return true}};
  return null;
}};

sb.auth.getSession().then(function(r){
  if(r.data&&r.data.session)ok();
  else{gate.hidden=false;document.getElementById('lg-email').focus()}
});
document.getElementById('loginform').addEventListener('submit',async function(e){
  e.preventDefault();
  var email=document.getElementById('lg-email').value.trim(),pw=document.getElementById('lg-pass').value;
  err.hidden=true;
  if(!email||!pw){err.textContent='Enter your email and password.';err.hidden=false;return}
  var b=document.getElementById('lg-btn');b.disabled=true;
  var r=await sb.auth.signInWithPassword({email:email,password:pw});
  b.disabled=false;
  if(r.error){err.textContent='That email and password did not work. Ask your administrator to check your account.';err.hidden=false;return}
  ok();
});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.tk)state.tk[d.dataset.tk]=d.open},true);
document.addEventListener('click',async function(e){
  if(e.target.closest&&e.target.closest('[data-signout]')){await sb.auth.signOut();location.reload()}
});
})();
</script>

const DEFAULT_STAGES=[

  ptypes:['Repair','Reroof','Government site'],utypes:['Field update','Client call','Permit','Issue'],staleDays:7,agingDays:30};
const CHECK=[

const ICONS={

  inbox:'<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>',

  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
  select:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
  chev:'<path d="M9 6l6 6-6 6"/>'
};
const ibtn=(icon,label,attrs,cls)=>'<button class="ibtn '+(cls||'')+'" type="button" '+attrs+' title="'+label+'" aria-label="'+label+'">'+ic(icon)+'</button>';
const tkOpen=(k,d)=>state.tk[k]===undefined?!!d:!!state.tk[k];
const tuck=(k,title,count,body,d)=>'<details class="tuck" data-tk="'+k+'"'+(tkOpen(k,d)?' open':'')+'><summary><span>'+title+'</span>'+(count!=null&&count!==''?'<span class="count">'+count+'</span>':'')+'<span class="chev">'+ic('chev')+'</span></summary><div class="tbody">'+body+'</div></details>';
const ic=n=>'<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>';

/* ---------- dates and formatting ---------- */
const MS=86400000;
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const today0=sod(new Date());
const days=(a,b)=>Math.round((sod(b)-sod(a))/MS);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{const a=String(s).slice(0,10).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const fmt=d=>d?d.toLocaleDateString('en-US',d.getFullYear()===today0.getFullYear()?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'}):'—';
const money=n=>n==null?'—':'$'+Math.round(n).toLocaleString('en-US');
const rel=d=>{const n=days(d,today0);return n<=0?'Today':n===1?'Yesterday':n+' days ago'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,r)=>(r||document).querySelector(s);
let mreEsc=null,mreRaw=null,mtab={};

function normApp(d){

  const D=DEF_APP;
  const lst=(a,def,must)=>{
    const r=Array.isArray(a)?a.map(x=>String(x).trim()).filter(Boolean):def.slice();
    must.slice().reverse().forEach(m=>{if(r.indexOf(m)<0)r.unshift(m)});
    return r.length?r:def.slice();
  };
  return {brand:Object.assign({},D.brand,d.brand||{}),perms:Object.assign({},D.perms,d.perms||{}),
    ptypes:lst(d.ptypes,D.ptypes,[]),utypes:lst(d.utypes,D.utypes,['Field update','Issue']),
    staleDays:Math.max(1,Math.round(Number(d.staleDays)||7)),agingDays:Math.max(1,Math.round(Number(d.agingDays)||30))};
}

const firstWord=n=>String(n||'').trim().split(/\s+/)[0]||'';
function handleOf(m){
  const f=firstWord(m.name);
  const same=state.team.filter(x=>x.active!==false&&firstWord(x.name).toLowerCase()===f.toLowerCase());
  return same.length>1?String(m.name).replace(/\s+/g,''):f;
}
function buildMre(){
  mtab={};
  const keys=[];
  const add=(k,id)=>{k=String(k||'').trim();if(!k)return;mtab[k.toLowerCase()]=id;if(keys.indexOf(k)<0)keys.push(k)};
  const firsts={};
  state.team.forEach(m=>{if(m.active!==false){const f=firstWord(m.name).toLowerCase();firsts[f]=(firsts[f]||0)+1}});
  state.team.forEach(m=>{
    add(m.name,m.id);
    add(String(m.name).replace(/\s+/g,''),m.id);
    if(m.active!==false&&firsts[firstWord(m.name).toLowerCase()]===1)add(firstWord(m.name),m.id);
  });
  keys.sort((a,b)=>b.length-a.length);
  const src=f=>keys.map(k=>reEsc(f(k))).join('|');
  mreEsc=keys.length?new RegExp('@('+src(esc)+')(?![A-Za-z0-9_])','gi'):null;
  mreRaw=keys.length?new RegExp('@('+src(x=>x)+')(?![A-Za-z0-9_])','gi'):null;
}
function mentionIds(note){
  const out=new Set();
  if(!mreRaw)return out;
  String(note).replace(mreRaw,(m0,k)=>{const id=mtab[k.toLowerCase()];if(id)out.add(id);return m0});
  return out;
}
function lev(a,b){
  const d=[];for(let i=0;i<=a.length;i++){d[i]=[i]}for(let j=0;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
function resolveToken(tok){
  const t=tok.toLowerCase();
  if(t.length<2)return null;
  const act=members();
  let c=act.filter(m=>m.name.toLowerCase().split(/\s+/).some(w=>w.indexOf(t)===0)||m.name.toLowerCase().replace(/\s+/g,'').indexOf(t)===0);
  if(c.length===1)return c[0];
  if(c.length>1)return null;
  c=act.filter(m=>lev(firstWord(m.name).toLowerCase(),t)<=1);
  return c.length===1?c[0]:null;
}
function normalizeMentions(note){
  const bad=[];
  let out=mreRaw?note.replace(new RegExp(mreRaw.source,'gi'),(m0,k)=>{const m=state.team.find(x=>x.id===mtab[k.toLowerCase()]);return m?'@'+handleOf(m):m0}):note;
  out=out.replace(/(^|[^A-Za-z0-9_])@([A-Za-z][A-Za-z'’-]*)/g,(m0,pre,tok)=>{
    if(mtab[tok.toLowerCase()]){const m=state.team.find(x=>x.id===mtab[tok.toLowerCase()]);return pre+'@'+handleOf(m)}
    const m=resolveToken(tok);
    if(m)return pre+'@'+handleOf(m);
    bad.push(tok);return m0;
  });
  return {text:out,bad:bad};
}

function closeMp(){state.mp=null;document.querySelectorAll('.mpop').forEach(n=>n.remove())}
function drawMp(){
  const mp=state.mp;
  if(!mp)return;
  const form=mp.ta.closest('form');
  let pop=form.querySelector('.mpop');
  if(!pop){pop=document.createElement('div');pop.className='mpop';pop.setAttribute('role','listbox');form.appendChild(pop)}
  pop.innerHTML=mp.items.map((id,i)=>{const m=state.team.find(x=>x.id===id);
    return '<button type="button" class="mopt" role="option" data-mpick="'+esc(id)+'" aria-selected="'+(i===mp.idx)+'"><span class="av sc-'+esc(m.color)+'" aria-hidden="true">'+initial(m.name)+'</span><b>'+esc(m.name)+'</b>'+(m.title?'<small>'+esc(m.title)+'</small>':'')+'</button>'}).join('');
}
function updateMp(ta){
  const pos=ta.selectionStart==null?ta.value.length:ta.selectionStart;
  const m=/(^|[^A-Za-z0-9_])@([A-Za-z'’-]*)$/.exec(ta.value.slice(0,pos));
  if(!m){closeMp();return}
  const q=m[2].toLowerCase();
  const c=members().filter(x=>!q||x.name.toLowerCase().split(/\s+/).some(w=>w.indexOf(q)===0)||x.name.toLowerCase().replace(/\s+/g,'').indexOf(q)===0).slice(0,6);
  if(!c.length){closeMp();return}
  const prev=state.mp&&state.mp.ta===ta?state.mp.idx:0;
  state.mp={ta:ta,start:pos-q.length-1,end:pos,items:c.map(x=>x.id),idx:Math.min(prev,c.length-1)};
  drawMp();
}
function pickMention(id){
  const mp=state.mp,m=state.team.find(x=>x.id===id);
  if(!mp||!m)return;
  const ta=mp.ta,ins='@'+handleOf(m)+' ';
  ta.value=ta.value.slice(0,mp.start)+ins+ta.value.slice(mp.end);
  const p=mp.start+ins.length;
  closeMp();ta.focus();ta.setSelectionRange(p,p);
}

function renameEverywhere(oldN,newN){
  if(!oldN||oldN===newN)return;
  state.projects.forEach(p=>{if(p.lead===oldN){p.lead=newN;const d=dehydrate(p);enqueue('projects/'+p.id,function(){return state.db.doc('projects/'+p.id).set(d)})}});
  const nh=firstWord(newN);
  const pats=[oldN];if(firstWord(oldN)!==oldN)pats.push(firstWord(oldN));
  const re=new RegExp('@('+pats.map(reEsc).join('|')+')(?![A-Za-z0-9_])','gi');
  state.updates.forEach(u=>{
    let ch=false;
    if(u.author===oldN){u.author=newN;ch=true}
    const nn=u.note.replace(re,'@'+nh);
    if(nn!==u.note){u.note=nn;ch=true}
    if(ch){const d=updData(u);enqueue('updates/'+u.id,function(){return state.db.doc('updates/'+u.id).set(d)})}
  });
}

/* ---------- inbox ---------- */
function inboxItems(){
  const me=state.me;
  if(!me||!me.name)return [];
  const from=readFrom(),out=[];
  state.updates.forEach(u=>{
    const p=byId(upid(u));
    const t=u.cid?state.threads.find(x=>x.id===u.cid):null;
    if(u.cid&&!t)return;
    if(!u.cid&&!p)return;
    const self=u.author===me.name;
    const m=mentionIds(u.note).has(me.id);
    const mine=!!p&&p.lead===me.name&&!self;
    const inT=!!t&&t.members.length>0&&t.members.indexOf(me.id)>=0&&!self;
    if(!m&&!mine&&!inT)return;
    out.push({u:u,p:p,t:t,self:self,unread:u.at>from&&!self,
      why:m?(self?'You tagged yourself':'Mentioned you'):inT?'New chat message':(u.type==='Issue'?'Issue on your job':'On your job')});
  });
  return out.sort((a,b)=>b.u.at-a.u.at);
}

function hydrate(id,d){
  const p=Object.assign({badge:false,bid:null,contract:null,invoiced:null,paid:null,sq:null,next:'',onedrive:'',gmail:'',links:[],client:'',addr:'',type:'Repair',lead:'',stage:'',job:'',name:'Untitled'},d);
  p.id=id;
  DATEK.forEach(k=>{p[k]=d[k]?fromIso(d[k]):null});
  p.check=Object.assign({},d.check||{});
  p.history=Array.isArray(d.history)?d.history.filter(h=>h&&h.at&&h.stage).slice(-60):[];
  p.extra=Array.isArray(d.extra)?d.extra.filter(x=>x&&x.id&&x.t).map(x=>({id:String(x.id),t:String(x.t),done:!!x.done})):[];
  if(Array.isArray(d.links))p.links=d.links.filter(x=>x&&okUrl(x.url)).map(x=>({id:String(x.id||linkId()),label:String(x.label||'').trim(),url:String(x.url).trim()}));
  else{p.links=[];if(okUrl(d.onedrive))p.links.push({id:'old-onedrive',label:'OneDrive folder',url:d.onedrive});if(okUrl(d.gmail))p.links.push({id:'old-gmail',label:'Gmail search',url:d.gmail})}
  p.chkMeta=(d.chkMeta&&typeof d.chkMeta==='object'&&!Array.isArray(d.chkMeta))?d.chkMeta:{};
  p.chkHide=Array.isArray(d.chkHide)?d.chkHide.map(String):[];
  p.log=Array.isArray(d.log)?d.log.filter(l=>l&&l.at&&l.t).slice(-60):[];
  return p;
}
function dehydrate(p){
  const o={};
  Object.keys(p).forEach(k=>{if(k!=='id')o[k]=p[k]});
  DATEK.forEach(k=>{o[k]=p[k]?iso(p[k]):null});
  return o;
}

}

function chkItems(p){
  const mt=p.chkMeta||{},hide=p.chkHide||[];
  return CHECK.filter(c=>(!c.badge||p.badge)&&hide.indexOf(c.k)<0).map(c=>({k:c.k,t:c.t,done:!!p.check[c.k],custom:false,meta:mt[c.k]||{}}))
    .concat((p.extra||[]).map(x=>({k:x.id,t:x.t,done:!!x.done,custom:true,meta:mt[x.id]||{}})))
    .map(c=>{c.stage=itemStage(p,c);return c});
}
function setTask(p,k,checked){
  const x=(p.extra||[]).find(y=>y.id===k);
  let label='';
  if(x){x.done=checked;label=x.t}
  else{p.check[k]=checked;const c=CHECK.find(y=>y.k===k);label=c?c.t:''}
  p.chkMeta=p.chkMeta||{};
  const mm=p.chkMeta[k]=p.chkMeta[k]||{};
  if(checked)mm.doneAt=iso(new Date());else delete mm.doneAt;
  logChange(p,(checked?'Checked off: ':'Unchecked: ')+label);
}
function nextSteps(p){
  if(st(p).done)return [];
  return chkItems(p).map((c,i)=>({c:c,i:i,d:c.meta.due?fromIso(c.meta.due).getTime():9e15}))
    .filter(x=>!x.c.done&&(x.c.stage===p.stage||x.c.stage===''))
    .sort((a,b)=>a.d-b.d||a.i-b.i).map(x=>x.c);
}
function nextOf(p){
  const n=nextSteps(p)[0];
  if(n)return {t:n.t,due:n.meta.due?fromIso(n.meta.due):null,who:n.meta.who||''};
  return {t:st(p).done?'':(p.next||''),due:st(p).done?null:(p.nextDue||null),who:''};
}
function nextStageOf(p){const i=state.stages.findIndex(s=>s.id===p.stage);return i>=0?state.stages[i+1]||null:null}
function attn(p){
  if(st(p).done)return null;
  const all=chkItems(p);
  const tasks=all.filter(c=>!c.done&&c.meta.due).map(c=>({c:c,o:days(fromIso(c.meta.due),today0)})).filter(x=>x.o>=-3).sort((a,b)=>b.o-a.o);
  const here=all.filter(c=>c.stage===p.stage),nxt=nextStageOf(p);
  const ready=here.length&&here.every(c=>c.done)&&nxt?nxt:null;
  if(!tasks.length&&!ready)return null;
  const mo=tasks.length?Math.max.apply(null,tasks.map(x=>x.o)):-99;
  return {tasks:tasks,ready:ready,score:(mo>0?2000+mo:tasks.length?1000:0)+tasks.length+(ready?1:0)};
}

const queues={};
function enqueue(path,fn){
  const q=(queues[path]||Promise.resolve()).then(fn).catch(function(){toast('Could not save that change. You may have view-only access.')});
  queues[path]=q;
  return q;
}
function canSave(){
  if(!state.db){toast('Saving is not available in this view.');return false}
  if(!state.canWrite){toast('You have view-only access, so changes are not saved.');return false}
  return true;
}
function saveProject(p){

}

function linkIcon(u){
  const h=String(u||'').toLowerCase();
  if(/onedrive|sharepoint|1drv\.ms|drive\.google|dropbox/.test(h))return 'folder';
  if(/docs\.google\.com\/spreadsheets|\.xls|sheet/.test(h))return 'sheet';
  if(/mail\.google|outlook|gmail/.test(h))return 'mail';

}

}

const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
function timeline(p){
  const ev=[];
  (p.history||[]).forEach(h=>ev.push({at:new Date(h.at),t:'Moved to <b>'+esc(stageOf(h.stage).name)+'</b>'+(h.by?' by '+esc(h.by):'')}));
  DATE_FIELDS.forEach(f=>{if(p[f[0]])ev.push({at:p[f[0]],t:esc(f[1]),date:true})});
  if(p.nextDue&&p.next)ev.push({at:p.nextDue,t:'Next step: '+esc(p.next),date:true});
  state.updates.filter(u=>u.pid===p.id).forEach(u=>ev.push({at:u.at,t:'<b>'+esc(u.author)+'</b> '+mention(esc(trunc(u.note,140)))}));
  state.threads.filter(t=>t.pid===p.id&&threadMine(t)).forEach(t=>ev.push({at:t.at,t:'Chat started: <b>'+esc(t.title)+'</b>'}));
  ev.sort((a,b)=>a.at-b.at);
  if(!ev.length)return '<p class="hint">Nothing recorded yet. Stage moves, dates and updates will build the story here.</p>';
  return '<ul class="tl">'+ev.map(e=>{const fut=e.date&&sod(e.at)>today0;return '<li class="'+(fut?'future':'')+'"><span class="when">'+fmt(e.at)+(fut?' · upcoming':'')+'</span>'+e.t+'</li>'}).join('')+'</ul>';

function navItems(g){

  return g.items.slice().sort((a,b)=>{const ia=ord.indexOf(a),ib=ord.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||g.items.indexOf(a)-g.items.indexOf(b)});

function navMove(gk,k,dir){

document.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('[data-nvk]');if(!r)return;nvDrag={k:r.dataset.nvk,g:r.dataset.nvg};e.dataTransfer.setData('text/plain',nvDrag.k);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const r=e.target.closest&&e.target.closest('[data-nvk]');document.querySelectorAll('.navrow.dragover').forEach(n=>{if(n!==r)n.classList.remove('dragover')});if(r&&nvDrag&&r.dataset.nvg===nvDrag.g&&r.dataset.nvk!==nvDrag.k){e.preventDefault();r.classList.add('dragover')}});

  e.preventDefault();
  const g=NAVG.find(x=>x.k===nvDrag.g),arr=navItems(g);
  arr.splice(arr.indexOf(nvDrag.k),1);
  arr.splice(arr.indexOf(r.dataset.nvk)+ (arr.indexOf(r.dataset.nvk)>=0?0:0),0,nvDrag.k);
  const p=navPrefs();p.order=p.order||{};p.order[g.k]=arr;navSave(p);nvDrag=null;buildNav();

function nextJob(){
  let best=null;
  state.projects.forEach(p=>{
    const m=/^(.*?)(\d+)(\D*)$/.exec(String(p.job||'').trim());
    if(m&&(!best||Number(m[2])>best.n))best={pre:m[1],n:Number(m[2]),len:m[2].length,suf:m[3]};
  });
  if(!best)return 'NI-0001';
  return (best.pre||'NI-')+String(best.n+1).padStart(Math.max(best.len,best.pre?1:4),'0')+best.suf;
}

function createThread(f){
  const d=state.draft,err=f.querySelector('[data-err]');
  const note=String(d.note||'').trim();
  if(!note){err.textContent='Write a first message.';err.hidden=false;return}
  const picked=Object.keys(d.sel).filter(k=>d.sel[k]);
  if(!d.all&&!picked.length){err.textContent='Pick at least one person, or choose everyone.';err.hidden=false;return}
  if(!canSave())return;
  const nm=normalizeMentions(note);
  let members=[];
  if(!d.all){
    members=picked.slice();
    if(state.me&&members.indexOf(state.me.id)<0)members.push(state.me.id);
    mentionIds(nm.text).forEach(id=>{if(members.indexOf(id)<0)members.push(id)});
  }
  let title=String(d.title||'').trim();
  if(!title){
    const p=d.pid?byId(d.pid):null;
    if(!d.all&&picked.length===1){const m=state.team.find(x=>x.id===picked[0]);title=m?m.name:'Chat'}
    else title=p?p.name:trunc(note.replace(/\s+/g,' '),40);
  }
  const ref=state.db.collection('updates').doc();
  const t={id:ref.id,title:title,pid:d.pid||null,members:members,by:state.me?state.me.id:'',at:new Date()};
  state.threads.push(t);
  enqueue('updates/'+t.id,function(){return ref.set(threadData(t))});
  const mref=state.db.collection('updates').doc();
  const u={id:mref.id,pid:null,cid:t.id,author:state.me?state.me.name:'',type:'Field update',at:new Date(Date.now()+1),note:nm.text};
  state.updates.push(u);
  enqueue('updates/'+u.id,function(){return mref.set(updData(u))});
  closePanel();
  state.view='updates';state.chat=t.id;state.chatOpen=true;state.forceBottom=true;
  render();state.forceBottom=false;
  if(nm.bad.length)toast('Could not match @'+nm.bad[0]+' to a teammate.');else toast('Chat started');
}
function goChat(id){
  if(state.openId!=null)closePanel();
  state.view='updates';state.chat=id;state.chatOpen=true;state.forceBottom=true;

}

function processLogo(file){
  if(!file)return;
  if(file.size>5e6){toast('That image is too large. Use one under 5 MB.');return}
  const r=new FileReader();
  r.onload=function(){
    const img=new Image();
    img.onload=function(){
      const w0=img.naturalWidth||img.width||300,h0=img.naturalHeight||img.height||150;
      const sc=Math.min(1,320/Math.max(w0,h0));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(w0*sc));c.height=Math.max(1,Math.round(h0*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let url=c.toDataURL('image/png');
      if(url.length>150000){
        const g=c.getContext('2d');g.globalCompositeOperation='destination-over';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
        url=c.toDataURL('image/jpeg',.85);
      }
      logoPicked(url);
    };
    img.onerror=function(){toast('Could not read that image. Try a PNG or JPG.')};
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

  if(state.team.some(x=>x.id!==me.id&&x.name.toLowerCase()===name.toLowerCase())){toast('Someone on the team already has that name.');return}
  if(!state.db){toast('Saving is not available right now.');return}
  const old=me.name;
  Object.assign(me,{name:name,title:d.title.trim(),phone:d.phone.trim(),color:d.color});
  if(old!==name)renameEverywhere(old,name);
  buildMre();saveTeam();
  closePanel();resolveMe();toast('Profile saved');
}
async function savePassword(){

}

function saveStages(){

      window.HUB_AUTH.createUser(em,pw).then(function(r){
        m._msg=(r.created?'Account created. ':'Password reset. ')+'Give '+m.name+' this temporary password: '+pw+'  They can change it under their profile.';m._acct=false;m._pw='';
        if(state.openId==='__settings')renderSettings();
      }).catch(function(e){m._msg=e.message||'Could not create the sign-in.';if(state.openId==='__settings')renderSettings()});

    if((b=t.closest('[data-stdel]'))){
      const i=Number(b.dataset.stdel),s=D[i];
      const n=state.projects.filter(p=>p.stage===s.id).length;
      if(n){toast(n+(n===1?' job is':' jobs are')+' in '+(s.name||'this stage')+'. Move them to another stage first.');return}
      if(D.length<=1){toast('Keep at least one stage.');return}
      D.splice(i,1);renderStages();return;
    }
    if((b=t.closest('[data-stcolor]'))){const a=b.dataset.stcolor.split(':');D[Number(a[0])].color=a[1];renderStages();return}
  }
  const ch=t.closest('[data-chat]');
  if(ch){state.chat=ch.dataset.chat;state.chatOpen=true;state.forceBottom=true;render();state.forceBottom=false;return}
  if(t.closest('[data-editdet]')){state.editDet=!state.editDet;renderPanel();return}
  if(t.closest('[data-delask]')){state.confirmDel=true;renderPanel();return}
  if(t.closest('[data-delno]')){state.confirmDel=false;renderPanel();return}
  if(t.closest('[data-delyes]')){deleteProject();return}
  if((mb=t.closest('[data-chkdel]'))){
    const p=cur();
    if(p&&canSave()){
      const k=mb.dataset.chkdel,x=(p.extra||[]).find(y=>y.id===k);
      let nm='';
      if(x){nm=x.t;p.extra=p.extra.filter(y=>y!==x)}
      else{const c=CHECK.find(y=>y.k===k);if(c){nm=c.t;p.chkHide=(p.chkHide||[]).concat([k]);delete p.check[k]}}
      if(p.chkMeta)delete p.chkMeta[k];

  if(t.closest('[data-plkadd]')){const p=cur();if(p){state.plkAdd=true;refreshLinks(p);const i=$('#plinkform input');if(i)i.focus()}return}

    return;
  }
  if(t.closest('[data-selmode]')){
    const p=cur();
    if(p){state.sel=(state.sel&&state.sel.on)?null:{on:true,keys:{}};refreshCheck(p)}

  if(t.closest('[data-selcancel]')){const p=cur();state.sel=null;if(p)refreshCheck(p);return}
  if(t.closest('[data-selall]')){const p=cur();if(p&&state.sel){chkItems(p).forEach(c=>{state.sel.keys[c.k]=true});refreshCheck(p)}return}
  if(t.closest('[data-seldel]')){
    const p=cur();
    if(p&&state.sel&&canSave()){
      const ks=Object.keys(state.sel.keys).filter(k=>state.sel.keys[k]);
      if(ks.length){
        ks.forEach(k=>{
          const x=(p.extra||[]).find(y=>y.id===k);
          if(x)p.extra=p.extra.filter(y=>y!==x);
          else if(CHECK.some(c=>c.k===k)){p.chkHide=(p.chkHide||[]).concat([k]);delete p.check[k]}
          if(p.chkMeta)delete p.chkMeta[k];
        });
        logChange(p,'Removed '+ks.length+' checklist item'+(ks.length===1?'':'s'));

      }
      state.sel=null;renderPanel();render();
    }

  if(t.closest('[data-chkrestore]')){
    const p=cur();
    if(p&&canSave()){p.chkHide=[];logChange(p,'Restored removed checklist items');saveProject(p);renderPanel();render()}

  if(t.closest('[data-feedall]')){state.feedPid=null;state.forceBottom=true;render();state.forceBottom=false;return}
