  if(nav){state.view=nav.dataset.nav;if(nav.dataset.nav==='updates'){state.chatOpen=false;state.feedPid=null}$('#app').classList.remove('navopen');buildNav();render();window.scrollTo(0,0);return}
  const ut=t.closest('[data-utype]');
  if(ut){state.utype=ut.dataset.utype;render();return}
  if(t.id==='overlay'||t.closest('#pclose')){closePanel();return}
  const c=t.closest('.card');
  if(c){openPanel(c.dataset.id);return}
  const op=t.closest('[data-open]');
  if(op){openPanel(op.dataset.open)}
});

function deleteProject(){
  const p=cur();
  if(!p||!can('del')||!canSave())return;
  const ups=state.updates.filter(u=>u.pid===p.id);
  const id=p.id,name=p.name;
  enqueue('projects/'+id,function(){return state.db.doc('projects/'+id).delete()});
  ups.forEach(u=>enqueue('updates/'+u.id,function(){return state.db.doc('updates/'+u.id).delete()}));
  state.projects=state.projects.filter(x=>x.id!==id);
  state.updates=state.updates.filter(u=>u.pid!==id);
  state.threads.filter(t=>t.pid===id).forEach(t=>{t.pid=null;saveThread(t)});
  closePanel();
  refresh();
  toast('Deleted '+name);
}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='due'&&t.closest&&t.closest('.chkadd')){const w=t.closest('.dpick');w.querySelector('.dtxt').textContent=t.value?fmt(fromIso(t.value)):'Add date';w.classList.toggle('set',!!t.value);return}
  if(t.name==='stage'&&t.closest&&t.closest('.chkadd')){t.closest('.wpick').querySelector('.wtxt').textContent=t.options[t.selectedIndex].text;return}
  if(t.dataset.hchk){
    const a=t.dataset.hchk.split('|'),hp=byId(a[0]);
    if(hp&&canSave()){setTask(hp,a[1],t.checked);saveProject(hp);render();if(cur()===hp){refreshCheck(hp);refreshHist(hp)}}
    return;
  }
  if(t.name==='who'&&t.closest&&t.closest('.chkadd')){const w=t.closest('.wpick');w.classList.toggle('set',!!t.value);w.querySelector('.wtxt').textContent=t.value||'Assign';return}
  if(t.id==='logofile'){processLogo(t.files&&t.files[0]);t.value='';return}
  if(t.id==='f-lead'){state.lead=t.value;render();return}
  if(t.id==='f-client'){state.client=t.value;render();return}
  if(t.dataset.stflag&&state.draft){const a=t.dataset.stflag.split(':');state.draft[Number(a[1])][a[0]]=t.checked;return}
  if(t.name==='pid'&&t.closest('form.composer')){state.postPid=t.value;return}
  if(t.dataset.thproj){const th=state.threads.find(x=>x.id===t.dataset.thproj);if(th&&canSave()){th.pid=t.value||null;saveThread(th);render();toast(th.pid?'Chat tied to project':'Chat no longer tied to a project')}return}
  const p=cur();
  if(!p||!t.closest('#pbody'))return;
  if(t.dataset.sel!==undefined){
    if(state.sel){state.sel.keys[t.dataset.sel]=t.checked;refreshCheck(p)}
    return;
  }
  if(t.dataset.cstage!==undefined){
    const k=t.dataset.cstage;
    p.chkMeta=p.chkMeta||{};
    const mm=p.chkMeta[k]=p.chkMeta[k]||{};
    mm.stage=t.value;
    const it=chkItems(p).find(c=>c.k===k);
    logChange(p,'"'+trunc(it?it.t:'item',40)+'" moved to '+(t.value?stageOf(t.value).name:'Anytime'));
    saveProject(p);refreshCheck(p);refreshHist(p);
    return;
  }
  if(t.dataset.cwho!==undefined||t.dataset.cdue!==undefined){
    const isW=t.dataset.cwho!==undefined,k=isW?t.dataset.cwho:t.dataset.cdue;
    p.chkMeta=p.chkMeta||{};
    const mm=p.chkMeta[k]=p.chkMeta[k]||{};
    const it=chkItems(p).find(c=>c.k===k),nm='"'+trunc(it?it.t:'item',40)+'"';
    if(isW){if(t.value)mm.who=t.value;else delete mm.who;logChange(p,nm+(t.value?' assigned to '+t.value:' unassigned'))}
    else{if(t.value)mm.due=t.value;else delete mm.due;logChange(p,nm+' due '+(t.value?fmt(fromIso(t.value)):'date cleared'))}
    saveProject(p);refreshCheck(p);refreshHist(p);
    return;
  }
  if(t.dataset.chk||t.dataset.xchk){
    setTask(p,t.dataset.chk||t.dataset.xchk,t.checked);
    saveProject(p);refreshCheck(p);refreshHist(p);render();
    return;
  }
  if(t.dataset.money){
    p[t.dataset.money]=numOrNull(t.value);
    logChange(p,(MONEY_FIELDS.find(m=>m[0]===t.dataset.money)||[0,t.dataset.money])[1]+(p[t.dataset.money]==null?' cleared':' set to '+money(p[t.dataset.money])));
    $('#collected').innerHTML=collectedHtml(p);
    saveProject(p);render();refreshHist(p);return;
  }
  if(t.dataset.date){
    p[t.dataset.date]=t.value?fromIso(t.value):null;
    logChange(p,(DATE_FIELDS.find(m=>m[0]===t.dataset.date)||[0,t.dataset.date])[1]+(p[t.dataset.date]?' set to '+fmt(p[t.dataset.date]):' cleared'));
    saveProject(p);render();refreshHist(p);return;
  }
  const f=t.dataset.f;
  if(!f)return;
  if(f==='stage'){moveStage(p,t.value);saveProject(p);render();refreshHist(p);refreshCheck(p);toast((p.job||p.name)+' moved to '+stageOf(t.value).name);return}
  if(f==='lead'||f==='type'){p[f]=t.value;logChange(p,(f==='lead'?'Field lead: ':'Project type: ')+(t.value||'Unassigned'));saveProject(p);render();refreshHist(p);return}
  if(f==='badge'){p.badge=t.checked;logChange(p,'Badge required: '+(t.checked?'yes':'no'));saveProject(p);renderPanel('badge');render();return}
  if(f==='sq'){p.sq=numOrNull(t.value);logChange(p,'Roof size '+(p.sq==null?'cleared':'set to '+p.sq+' squares'));saveProject(p);refreshHist(p);return}
  if(f==='nextDue'){p.nextDue=t.value?fromIso(t.value):null;logChange(p,'Next step due '+(p.nextDue?fmt(p.nextDue):'cleared'));saveProject(p);render();renderPanel();return}
  if(f==='onedrive'||f==='gmail'){
    const v=t.value.trim();
    if(v&&!okUrl(v)){toast('That does not look like a web address. It should start with https://');t.value=p[f];return}
    p[f]=v;logChange(p,(f==='onedrive'?'OneDrive link':'Gmail link')+(v?' updated':' removed'));saveProject(p);renderPanel();return;
  }
  if(f==='name'){
    const v=t.value.trim();
    if(!v){t.value=p.name;return}
    logChange(p,'Renamed to '+trunc(v,60));p.name=v;$('#ptitle').textContent=v;saveProject(p);render();refreshHist(p);return;
  }
  if(f==='job'||f==='client'||f==='addr'||f==='next'){
    p[f]=t.value.trim();
    logChange(p,({job:'Job #',client:'Client',addr:'Site address',next:'Next step'})[f]+(p[f]?': '+trunc(p[f],60):' cleared'));
    if(f==='job')$('#pjob').textContent=(p.job?p.job+' · ':'')+p.type;
    saveProject(p);
    if(f==='client')fillClients();
    render();refreshHist(p);return;
  }
});

document.addEventListener('submit',e=>{
  const f=e.target.closest?e.target.closest('form'):null;
  if(!f)return;
  e.preventDefault();
  if(f.id==='linkform'){
    const err=f.querySelector('[data-err]'),label=f.elements.label.value.trim(),url=f.elements.url.value.trim();
    if(!okUrl(url)){err.textContent='Enter a web address that starts with https://';err.hidden=false;f.elements.url.focus();return}
    if(!canSave())return;
    const lid=f.dataset.lid;
    if(lid){const x=state.links.find(l=>l.id===lid);if(x){x.label=label||linkHost(url);x.url=url}}
    else state.links.push({id:linkId(),label:label||linkHost(url),url:url});
    state.linkEdit=null;saveLinks();render();toast('Link saved');
    return;
  }
  if(f.id==='plinkform'){
    const p=cur(),err=f.querySelector('[data-err]'),label=f.elements.label.value.trim(),url=f.elements.url.value.trim();
    if(!p)return;
    if(!okUrl(url)){err.textContent='Enter a web address that starts with https://';err.hidden=false;f.elements.url.focus();return}
    if(!canSave())return;
    p.links=(p.links||[]).concat([{id:linkId(),label:label||linkHost(url),url:url}]);
    logChange(p,'Added link: '+trunc(label||linkHost(url),40));
    state.plkAdd=false;saveProject(p);refreshLinks(p);refreshHist(p);
    return;
  }
  if(f.id==='chkform'){
    const p=cur(),v=f.elements.item.value.trim();
    if(!p||!v)return;
    if(!canSave())return;
    p.extra=(p.extra||[]).concat([{id:'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),t:v,done:false}]);
    const nid=p.extra[p.extra.length-1].id,who=f.elements.who.value,due=f.elements.due.value;
    p.chkMeta=p.chkMeta||{};p.chkMeta[nid]={stage:f.elements.stage.value};if(who)p.chkMeta[nid].who=who;if(due)p.chkMeta[nid].due=due;
    logChange(p,'Added checklist item: '+trunc(v,60)+(who?' (assigned to '+who+')':''));
    saveProject(p);renderPanel('newitem');render();
    return;
  }
  if(f.id==='threadform'){createThread(f);return}
  if(f.id==='newform'){
    const name=f.elements.name.value.trim();
    const err=f.querySelector('[data-err]');
    if(!name){err.textContent='Give the project a name.';err.hidden=false;f.elements.name.focus();return}
    if(!canSave())return;
    const ref=state.db.collection('projects').doc();
    const p=hydrate(ref.id,{
      name:name,job:nextJob(),client:f.elements.client.value.trim(),addr:f.elements.addr.value.trim(),
      type:f.elements.type.value,lead:'',stage:f.elements.stage.value,
      contract:numOrNull(f.elements.contract.value),check:{},history:[{at:new Date().toISOString(),stage:f.elements.stage.value,by:myName()}]
    });
    state.projects.push(p);
    const data=dehydrate(p);
    enqueue('projects/'+ref.id,function(){return ref.set(data)});
    closePanel();refresh();toast('Added '+name);
    return;
  }
  if(f.id==='claimfirst'||f.id==='claimnew'){
    const name=$('#cl-name').value.trim(),err=f.querySelector('[data-err]'),em=myEmail();
    if(!name){err.textContent='Enter your name.';err.hidden=false;return}
    if(f.id==='claimnew'&&state.team.some(m=>m.name.toLowerCase()===name.toLowerCase())){err.textContent='That name is already on the list. Pick it above instead.';err.hidden=false;return}
    if(!state.db)return;
    if(f.id==='claimfirst'){
      const seen={};seen[name.toLowerCase()]=1;
      const list=[normMember({id:newId(),name:name,email:em,role:'admin'},0)];
      const old=[];
      state.projects.forEach(p=>{old.push(p.lead)});
      state.updates.forEach(u=>{old.push(u.author)});
      old.forEach(n=>{n=String(n||'').trim();if(n&&!seen[n.toLowerCase()]){seen[n.toLowerCase()]=1;list.push(normMember({id:newId(),name:n,role:'member'},list.length))}});
      state.team=list;
    }else{
      state.team.push(normMember({id:newId(),name:name,email:em,role:'member'},state.team.length));
    }
    buildMre();saveTeam();closePanelForce();resolveMe();toast('Welcome, '+name);
    return;
  }
  if(!f.classList.contains('composer'))return;
  const note=f.elements.note.value.trim();
  const err=f.querySelector('[data-err]');
  if(!note){err.textContent='Write a note before posting.';err.hidden=false;f.elements.note.focus();return}
  if(!canSave())return;
  const nm=normalizeMentions(note);
  closeMp();
  if(nm.bad.length)toast('Could not match @'+nm.bad[0]+' to a teammate. Pick a name from the list after typing @.');
  const cid=f.dataset.cid||null;
  const pid=cid?null:(f.dataset.pid?f.dataset.pid:f.elements.pid.value);
  const ref=state.db.collection('updates').doc();
  const u={id:ref.id,pid:pid,cid:cid,author:f.elements.author.value,type:f.elements.type.value,at:new Date(),note:nm.text};
  state.updates.push(u);
  enqueue('updates/'+ref.id,function(){return ref.set(updData(u))});
  if(cid){
    const th=state.threads.find(x=>x.id===cid);
    if(th&&th.members.length){let ch=false;mentionIds(nm.text).forEach(id=>{if(th.members.indexOf(id)<0){th.members.push(id);ch=true}});if(ch)saveThread(th)}
  }
  const p=pid?byId(pid):null;
  f.elements.note.value='';
  state.forceBottom=true;
  if(state.openId!=null){renderPanel('note');render()}
  else{render();const ta=content.querySelector('textarea[name="note"]');if(ta)ta.focus()}
  state.forceBottom=false;
  if(!nm.bad.length)toast(cid?'Sent':'Update posted to '+(p?(p.job||p.name):'project'));
});

let dragId=null;
document.addEventListener('dragstart',e=>{
  const c=e.target.closest?e.target.closest('.card'):null;
  if(!c)return;
  dragId=c.dataset.id;
  e.dataTransfer.setData('text/plain',dragId);
  e.dataTransfer.effectAllowed='move';
  c.classList.add('dragging');
});
document.addEventListener('dragend',()=>{
  dragId=null;
  document.querySelectorAll('.dragging,.over').forEach(n=>n.classList.remove('dragging','over'));
});
document.addEventListener('dragover',e=>{
  const col=e.target.closest?e.target.closest('.col'):null;
  if(!col||dragId==null)return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.over').forEach(n=>{if(n!==col)n.classList.remove('over')});
  col.classList.add('over');
});
document.addEventListener('drop',e=>{
  const col=e.target.closest?e.target.closest('.col'):null;
  if(!col||dragId==null)return;
  e.preventDefault();
  const p=byId(dragId);
  const to=col.dataset.stage;
  dragId=null;
  if(p&&p.stage!==to){const from=stageOf(p.stage).name;moveStage(p,to);saveProject(p);render();toast((p.job||p.name)+' moved from '+from+' to '+stageOf(to).name)}
  else render();
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches&&t.matches('textarea[name="note"]'))updateMp(t);
  if(t.dataset&&t.dataset.pf&&state.openId==='__profile'&&state.draft){state.draft[t.dataset.pf]=t.value;return}
  if(state.openId==='__thread'&&state.draft&&t.dataset){
    const d=state.draft;
    if(t.dataset.th){d[t.dataset.th]=t.value;return}
    if(t.dataset.thall!==undefined){d.all=t.checked;renderThreadForm();return}
    if(t.dataset.thsel){d.sel[t.dataset.thsel]=t.checked;return}
  }
  if(settingsInput(t))return;
  if(t.dataset&&t.dataset.stname!=null&&state.draft){
    const i=Number(t.dataset.stname);state.draft[i].name=t.value;
    const pv=t.closest('.strow').querySelector('.pill');if(pv)pv.textContent=t.value||'Stage';
  }
});
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('.mpop'))e.preventDefault()});
document.addEventListener('focusout',e=>{if(e.target.matches&&e.target.matches('textarea[name="note"]'))setTimeout(()=>{if(document.activeElement!==e.target)closeMp()},150)});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(state.mp&&t===state.mp.ta){
    const mp=state.mp;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();mp.idx=(mp.idx+(e.key==='ArrowDown'?1:-1)+mp.items.length)%mp.items.length;drawMp();return}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pickMention(mp.items[mp.idx]);return}
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeMp();return}
  }
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&t.matches&&t.matches('textarea[name="note"]')){
    e.preventDefault();
    const f=t.closest('form');if(f&&f.requestSubmit)f.requestSubmit();
    return;
  }
  if(state.openId==null)return;
  if(e.key==='Escape'){closePanel();return}
  if(e.key==='Tab'){
    const f=Array.from($('#panel').querySelectorAll('button,select,input,textarea,a[href]')).filter(n=>!n.disabled&&n.offsetParent!==null);
    if(!f.length)return;
    const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
  }
});

/* ---------- connect to the shared store ---------- */
buildNav();
try{if(localStorage.getItem('hub-side')==='1'&&window.innerWidth>860)$('#app').classList.add('collapsed')}catch(e){}
fillClients();
render();

function onErr(){setSync('bad');state.loaded=true;render()}
(async function start(){
  let db=null;
  try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db){
    state.loaded=true;
    setSync('bad','Not saving');
    const n=$('#notice');
    n.textContent='This view cannot reach the shared hub, so nothing is shown or saved. Open the page from your Claude account.';
    n.hidden=false;
    render();
    return;
  }
  state.db=db;
  let gotP=false;
  db.collection('projects').onSnapshot(function(snap){
    state.projects=snap.docs.map(d=>hydrate(d.id,d.data()));
    gotP=true;state.loaded=true;
    setSync('ok');
    refresh();
  },onErr);
  db.collection('updates').onSnapshot(function(snap){
    const ts=[],us=[];
    snap.docs.forEach(d=>{const x=d.data()||{};if(x.kind==='thread')ts.push(hydrateThread(d.id,x));else us.push(hydrateUpdate(d.id,x))});
    state.threads=ts;state.updates=us;
    if(gotP)refresh();
  },onErr);
  db.doc('settings/stages').onSnapshot(function(s){
    const d=s.exists?(s.data()||{}):{};
    state.stages=Array.isArray(d.list)&&d.list.length?d.list.map(normStage):DEFAULT_STAGES.map(x=>normStage(x));
    if(state.openId==='__stages')return;
    if(gotP)refresh();
  },function(){});
  db.doc('settings/links').onSnapshot(function(s){
    if(state.linkEdit)return;
    state.links=normLinks(s.exists?s.data():null);
    if(gotP)render();
  },function(){});
  db.doc('settings/app').onSnapshot(function(s){
    state.app=normApp(s.exists?s.data():null);
    applyApp();loadLogo();refresh();
  },function(){});
  db.doc('settings/team').onSnapshot(function(s){
    const d=s.exists?(s.data()||{}):{};
    state.team=Array.isArray(d.list)?d.list.map(normMember):[];
    state.teamLoaded=true;
    buildMre();resolveMe();
  },function(){});
})();
})();
</script>
